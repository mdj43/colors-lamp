name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: colors_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --working-dir=api --no-interaction --prefer-dist

      - name: Create test configuration
        run: |
          cat > api/.env <<'EOF'
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=colors_test
          EOF

          cat > tests/backend/.env.test <<'EOF'
          TEST_USERNAME=jest-user
          TEST_PASSWORD=jest-password
          EOF

      - name: Create test database schema
        run: |
          sed 's/CREATE DATABASE `colors_database`;/CREATE DATABASE IF NOT EXISTS `colors_test`;/; s/USE `colors_database`;/USE `colors_test`;/' database.sql |
            mysql -h 127.0.0.1 -P 3306 -uroot -proot

          mysql -h 127.0.0.1 -P 3306 -uroot -proot colors_test -e "
            INSERT INTO users (first_name, last_name, username, password)
            VALUES ('Test', 'User', 'jest-user', MD5('jest-password'));
          "

      - name: Run linters
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run backend tests
        run: npm run test:backend